[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-scout-loop"
version = "0.1.0"
description = "Evidence-first upstream contribution lifecycle: discover, validate, review, verify, portfolio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "httpx>=0.27,<1", "PyYAML>=6,<7"]

[project.scripts]
repo-scout = "repo_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

